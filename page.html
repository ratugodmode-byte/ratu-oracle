<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ratu Oracle Page</title>
  <meta name="description" content="Ratu Oracle public page.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="icon" type="image/svg+xml" href="assets/logo/chant-sphere-logo.svg">
  <style>
    :root { --ink:#1f1728; --muted:#6e6374; --plum:#44226b; --line:#eadfd2; --paper:#fffaf4; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(180deg,#fffdf9,#f7efe5); }
    .shell { width:min(980px,calc(100% - 32px)); margin:0 auto; }
    header { border-bottom:1px solid var(--line); background:rgba(255,250,244,.9); }
    nav { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    a { color:inherit; }
    .brand { display:inline-flex; align-items:center; gap:10px; text-decoration:none; font-weight:900; letter-spacing:.08em; }
    .brand img { width:40px; height:40px; border-radius:10px; }
    .btn { border:1px solid #b89b82; border-radius:6px; background:white; min-height:40px; display:inline-flex; align-items:center; padding:0 16px; text-decoration:none; text-transform:uppercase; font-size:12px; font-weight:850; }
    .btn.primary { background:var(--plum); border-color:var(--plum); color:white; }
    main { padding:56px 0; }
    .panel { border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:28px; box-shadow:0 18px 48px rgba(48,29,17,.1); }
    h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(40px,6vw,68px); line-height:1; margin:0; color:#2d1744; font-weight:500; }
    p { color:#3a2e41; line-height:1.8; font-size:17px; }
    .keywords { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
    .keywords span { border:1px solid rgba(184,122,44,.28); background:white; border-radius:999px; padding:8px 10px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <nav class="shell">
      <a class="brand" href="/"><img src="assets/logo/chant-sphere-logo.svg" alt="">Ratu Oracle</a>
      <a class="btn" href="/">Marketplace</a>
    </nav>
  </header>
  <main class="shell">
    <article class="panel">
      <h1 id="title">Ratu Oracle Page</h1>
      <p id="description">Loading page...</p>
      <p><a class="btn primary" id="primaryLink" href="/" target="_blank" rel="noreferrer">Open Link</a></p>
      <div id="body"></div>
      <div class="keywords" id="keywords"></div>
    </article>
  </main>
  <script>
    const slug = new URLSearchParams(location.search).get("slug") || "free-tarot-reading";
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }
    function paragraphs(text) {
      return String(text || "").split(/\n{2,}/).map(part => `<p>${escapeHtml(part.trim())}</p>`).join("");
    }
    function applyPage(page) {
      document.title = `${page.title || "Ratu Oracle Page"} | Ratu Oracle`;
      document.getElementById("title").textContent = page.title || "Ratu Oracle Page";
      document.getElementById("description").textContent = page.description || "";
      document.getElementById("body").innerHTML = paragraphs(page.body || "");
      document.getElementById("primaryLink").href = page.primary_url || "/";
      document.getElementById("primaryLink").textContent = page.primary_label || "Open Link";
      document.getElementById("keywords").innerHTML = String(page.keywords || "").split(",").filter(Boolean).map(word => `<span>${escapeHtml(word.trim())}</span>`).join("");
      const desc = document.querySelector('meta[name="description"]');
      if (desc && page.description) desc.content = page.description;
    }
    async function loadPage() {
      const fallback = {
        title: "Free Tarot Reading and Chant Sphere Guidance",
        description: "Use free tarot guidance to choose the Chant Sphere, talisman, amulet, or Solomon seal that fits your current energy.",
        primary_url: "https://statuesque-kitsune-459769.netlify.app/",
        primary_label: "Start Free Tarot Reading",
        body: "Use the free Ratu Oracle reading first. Then choose the Chant Sphere whose meaning matches your current energy and the action you are ready to take.",
        keywords: "tarot, free tarot, free tarot reading, chant spheres, talisman, amulets, solomon's seal"
      };
      try {
        const response = await fetch("/.netlify/functions/site-settings");
        const { settings = {} } = await response.json();
        const pages = JSON.parse(settings.content_pages || "[]");
        applyPage((Array.isArray(pages) && pages.find(page => page.slug === slug)) || fallback);
      } catch {
        applyPage(fallback);
      }
    }
    loadPage();
  </script>
</body>
</html>
